name: Build Whisper Java and CLI

on:
  push:
    branches: [self]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            resource: darwin
            arch: arm64
          - platform: macos-x64
            runner: macos-15-intel
            resource: darwin-x86-64
            arch: x86_64
          - platform: windows-x64
            runner: windows-2022
            resource: win32-x86-64
            arch: x64
            vs-arch: amd64
            vs-component: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
            vs-generator: Visual Studio 17 2022
          - platform: windows-arm64
            runner: windows-11-vs2026-arm
            resource: win32-aarch64
            arch: ARM64
            vs-arch: arm64
            vs-component: Microsoft.VisualStudio.Component.VC.Tools.ARM64
            vs-generator: Visual Studio 18 2026
          - platform: linux-x64
            runner: ubuntu-24.04
            resource: linux-x86-64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            resource: linux-aarch64

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.platform == 'windows-arm64' && 'microsoft' || 'temurin' }}
          java-version: '17'
          cache: maven
          cache-dependency-path: bindings/java/pom.xml

      - name: Build macOS native libraries and CLI
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          log="$RUNNER_TEMP/native-build.log"
          trap 'printf "::error::%s\n" "$(tail -n 24 "$log" | awk '\''{gsub(/%/, "%25"); gsub(/\r/, "%0D"); printf "%s%%0A", $0}'\'')"' ERR
          {
          bash bindings/java/build-macos.sh "$RUNNER_TEMP/whisper-native" "$TARGET_ARCH"
          cmake -S . -B "$RUNNER_TEMP/whisper-cli" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="$TARGET_ARCH" -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_METAL_EMBED_LIBRARY=ON \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build "$RUNNER_TEMP/whisper-cli" --parallel 3 --target whisper-cli
          mkdir -p dist
          cli="$RUNNER_TEMP/whisper-cli/bin/whisper-cli"
          "$cli" --help
          tar -czf dist/whisper-cli.tar.gz -C "$(dirname "$cli")" whisper-cli
          } 2>&1 | tee "$log"

      - name: Build Windows native libraries and CLI
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          VS_ARCH: ${{ matrix.vs-arch }}
          VS_COMPONENT: ${{ matrix.vs-component }}
          VS_GENERATOR: ${{ matrix.vs-generator }}
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires $env:VS_COMPONENT -property installationPath
          if (-not $vs) { throw "Visual Studio C++ toolchain not found" }
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch $env:VS_ARCH -HostArch $env:VS_ARCH -SkipAutomaticLocation
          & ./bindings/java/build-windows.ps1 -BuildDirectory "$env:RUNNER_TEMP/whisper-native" -Architecture $env:TARGET_ARCH -Generator $env:VS_GENERATOR
          $build = "$env:RUNNER_TEMP/whisper-cli"
          cmake -S . -B $build -G $env:VS_GENERATOR -A $env:TARGET_ARCH `
            -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF `
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $build --config Release --parallel 4 --target whisper-cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$build/bin/Release/whisper-cli.exe" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          tar.exe -czf dist/whisper-cli.tar.gz -C "$build/bin/Release" whisper-cli.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Linux native libraries and CLI with GLIBC 2.31
        if: runner.os == 'Linux'
        shell: bash
        run: |
          log="$RUNNER_TEMP/native-build.log"
          trap 'printf "::error::%s\n" "$(tail -n 24 "$log" | awk '\''{gsub(/%/, "%25"); gsub(/\r/, "%0D"); printf "%s%%0A", $0}'\'')"' ERR
          {
          # 原生库和 CLI 使用相同的低版本 GLIBC，Maven 在宿主 runner 上运行。
          docker run --rm -i -v "$PWD:/workspace" -w /workspace ubuntu:20.04 bash -se <<'BUILD'
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates git patchelf python3-pip
          python3 -m pip install --no-cache-dir cmake==3.31.10
          git config --global --add safe.directory /workspace
          CMAKE_BUILD_PARALLEL_LEVEL=4 bash bindings/java/build-linux.sh /tmp/whisper-native
          cmake -S . -B /tmp/whisper-cli -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build /tmp/whisper-cli --parallel 4 --target whisper-cli
          /tmp/whisper-cli/bin/whisper-cli --help
          tar -czf - -C /tmp/whisper-cli/bin whisper-cli > /workspace/whisper-cli.tar.gz
          BUILD
          mkdir -p dist
          mv whisper-cli.tar.gz dist/
          } 2>&1 | tee "$log"

      - name: Package and verify platform JAR
        shell: bash
        env:
          NATIVE_RESOURCE: ${{ matrix.resource }}
        run: |
          # 每个 JAR 只包含当前 runner 重新编译的原生资源。
          resources=bindings/java/src/main/resources
          for directory in "$resources"/darwin* "$resources"/win32-* "$resources"/linux-*; do
            if [[ -d "$directory" && "${directory##*/}" != "$NATIVE_RESOURCE" ]]; then
              rm -r -- "$directory"
            fi
          done
          log="$RUNNER_TEMP/maven-build.log"
          if ! mvn -B -f bindings/java/pom.xml -Dtest=WhisperJnaLibraryTest clean package 2>&1 | tee "$log"; then
            printf '::error::%s\n' "$(grep -E 'ERROR|Exception|UnsatisfiedLinkError' "$log" | tail -n 24 | awk '{gsub(/%/, "%25"); gsub(/\r/, "%0D"); printf "%s%%0A", $0}')"
            exit 1
          fi
          for archive in bindings/java/target/whispercpp-*.jar; do
            case "$archive" in
              *-sources.jar|*-javadoc.jar) continue ;;
            esac
            cp "$archive" dist/
          done
          jar tf dist/whispercpp-*.jar > jar-entries.txt
          for library in "$resources/$NATIVE_RESOURCE/"*; do
            grep -Fx "$NATIVE_RESOURCE/${library##*/}" jar-entries.txt
          done

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: whisper-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
